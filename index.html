<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life of a Tomato</title>
  <meta name="description" content="One tomato, drawn once a week in a new technique, with notes on each technique and scores for the tomato.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow" id="range"></p>
        <h1 id="title"></h1>
        <p class="lede" id="subtitle"></p>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="path" aria-pressed="true">Timeline</button>
        <button type="button" data-view="reports" aria-pressed="false">Reports</button>
        <button type="button" data-view="notes" aria-pressed="false">Notes</button>
      </div>
    </header>

    <main class="scene">
      <!-- The Time Stone: wind the ring to move through the weeks -->
      <section class="scrubber" aria-label="Wind back time">
        <div class="dial-box">
          <div class="stage-wrap" id="dial" role="slider" tabindex="0" aria-label="Time dial: drag around the ring or spin the tomato">
            <div class="stage" id="stage">
              <div class="frames" id="frames"></div>
              <span class="side-tag left" id="tag-drawing">Drawing</span>
              <span class="side-tag right" id="tag-photo">Photo</span>
              <!-- Drawing on the left of the line, photo on the right -->
              <div class="split" id="split" role="slider" tabindex="0" aria-label="Drawing to photo" aria-valuemin="0" aria-valuemax="100">
                <span class="split-knob" aria-hidden="true"></span>
              </div>
            </div>
            <svg class="ring" viewBox="-20 -20 240 240" aria-hidden="true" id="ring"></svg>
            <canvas class="sparks" id="sparks" aria-hidden="true"></canvas>
          </div>
        </div>
        <div class="scrub-controls">
          <button type="button" class="play" id="play" aria-label="Play">▶</button>
          <div class="scrub-meta">
            <span class="scrub-week" id="scrub-week"></span>
            <span class="scrub-date" id="scrub-date"></span>
          </div>
        </div>
        <p class="hint">Wind the ring to move through time. Drag the line to wipe between drawing and photo.</p>
      </section>

      <!-- The path: every week from start to finish -->
      <section class="path" aria-label="The tomato, week by week">
        <svg class="board" id="board" viewBox="0 0 600 560" preserveAspectRatio="xMidYMid meet"></svg>
        <article class="detail" id="detail" aria-live="polite"></article>
        <div class="charts" id="charts" hidden></div>
        <div class="method" id="method" hidden></div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
